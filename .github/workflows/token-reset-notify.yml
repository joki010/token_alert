name: Claude Code Token Reset Notify
run-name: ${{ inputs.target_label || 'Claude Code 5시간' }} ${{ inputs.reset_time }}

# workflow_dispatch — 로컬 watcher.py 가 dispatch 함
on:
  workflow_dispatch:
    inputs:
      reset_time:
        description: "초기화 예정 시각 (KST, 예: 2026-01-01T21:00:00+09:00)"
        required: true
        type: string
      notify_time:
        description: "알림 전송 시각 (KST, 예: 2026-01-01T20:50:00+09:00)"
        required: false
        type: string
      target_label:
        description: "알림 대상 (예: Codex work 5시간, Claude 7일)"
        required: false
        default: "Claude Code 5시간"
        type: string

concurrency:
  group: token-reset-notify-${{ inputs.target_label || 'Claude Code 5시간' }}-${{ inputs.reset_time }}
  cancel-in-progress: false

jobs:
  notify:
    name: Wait and Notify
    runs-on: ubuntu-latest
    # 최대 실행 시간 6시간 (GitHub Actions 기본 제한)
    # Claude Code 5시간 윈도우보다 여유 있음
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: 초기화 시각까지 대기
        id: wait
        env:
          RESET_TIME: ${{ inputs.reset_time }}
          NOTIFY_TIME: ${{ inputs.notify_time || inputs.reset_time }}
        run: |
          # UTC 현재 시각
          NOW=$(date -u +%s)

          # 목표 시각을 epoch 초로 변환 (KST +09:00 포함 ISO 8601)
          TARGET=$(date -d "$NOTIFY_TIME" +%s 2>/dev/null || echo "0")

          if [ "$TARGET" = "0" ]; then
            echo "⚠️  시각 파싱 실패: $NOTIFY_TIME"
            exit 1
          fi

          DIFF=$((TARGET - NOW))
          echo "reset_time=$RESET_TIME" >> $GITHUB_OUTPUT
          echo "notify_time=$NOTIFY_TIME" >> $GITHUB_OUTPUT

          if [ "$DIFF" -le 0 ]; then
            echo "✅ 이미 초기화 시각이 지났거나 현재 시각입니다. 즉시 알림 전송."
          else
            echo "⏳ ${DIFF}초 대기 중 (약 $((DIFF / 60))분)..."
            sleep "$DIFF"
            echo "✅ 대기 완료"
          fi

      - name: 텔레그램 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESET_TIME: ${{ inputs.reset_time }}
          NOTIFY_TIME: ${{ inputs.notify_time || inputs.reset_time }}
          TARGET_LABEL: ${{ inputs.target_label || 'Claude Code 5시간' }}
        run: |
          # KST 표시 (입력값이 이미 +09:00 기준)
          RESET_KST=$(TZ=Asia/Seoul date -d "$RESET_TIME" "+%Y-%m-%d %H:%M KST" 2>/dev/null || echo "$RESET_TIME")

          NOTIFY_KST=$(TZ=Asia/Seoul date -d "$NOTIFY_TIME" "+%Y-%m-%d %H:%M KST" 2>/dev/null || echo "$NOTIFY_TIME")
          TARGET_LABEL_HTML=$(printf '%s' "$TARGET_LABEL" | python3 -c 'import html,sys; print(html.escape(sys.stdin.read()))')

          case "$TARGET_LABEL" in
            *Codex*) ICON_PATH="assets/telegram/codex.png" ;;
            *Claude*) ICON_PATH="assets/telegram/claudecode.png" ;;
            *) ICON_PATH="assets/telegram/claudecode.png" ;;
          esac

          MESSAGE=$'🔔 <b>'"${TARGET_LABEL_HTML}"$' 토큰 초기화 완료</b>\n──────────────────\n• 초기화 시각: <code>'"${RESET_KST}"$'</code>\n• 알림 전송: <code>'"${NOTIFY_KST}"$'</code>\n\n<i>token_alert by GitHub Actions</i>'

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "photo=@${ICON_PATH}" \
            -F "caption=${MESSAGE}" \
            -F "parse_mode=HTML" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          if r.get('ok'):
              print('✅ 텔레그램 알림 전송 성공')
          else:
              print(f'❌ 전송 실패: {r}')
              sys.exit(1)
          "

      - name: 완료 요약
        if: always()
        run: |
          echo "### 알림 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 대상: \`${{ inputs.target_label || 'Claude Code 5시간' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 초기화 시각: \`${{ inputs.reset_time }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 알림 시각: \`${{ inputs.notify_time || inputs.reset_time }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 완료: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
